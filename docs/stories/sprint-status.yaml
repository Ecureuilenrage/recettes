# =============================================================================
# sprint-status.yaml — Source de vérité du suivi de sprint (méthode BMAD)
# -----------------------------------------------------------------------------
# Généré depuis docs/sprint-plan.md (planning du 2026-06-01).
# Référez-vous à ce fichier pour `create-story` : il porte le statut, les
# dépendances, le sprint cible, les fichiers cibles et les réserves (RZ) de
# chaque story. Mettez à jour le champ `status` au fil de l'avancement.
#
# Conventions :
#   status     : done | todo | blocked | in_progress
#   priority   : P0 (socle/cœur) | P1 (v1 fonctionnelle) | P2 (polish/extension)
#   blocked    => se débloque mécaniquement quand toutes ses `deps` sont `done`.
# Docs liés : PRD.md (v0.2) · architecture.md · backlog.md · readiness-check.md
#             validation-prd.md · decisions-techniques.md · sprint-plan.md
# =============================================================================

