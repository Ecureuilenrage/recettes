{% extends "base.html" %}

{% block title %}Générer une recette — Recettes Épicure{% endblock %}

{% block content %}
  <form method="post" action="/generate-ui">
    <div class="panel">
      <label for="hero">Ingrédient héros
        <span class="hint">— terme FR connu du vocabulaire Épicure (ex. « basilic », « tomate »).</span>
      </label>
      <input type="text" id="hero" name="hero" value="{{ form.hero }}" placeholder="basilic" required>

      <div class="row">
        <div>
          <label for="cuisine">Cuisine</label>
          <select id="cuisine" name="cuisine">
            <option value="italian_savory_v1" {% if form.cuisine == "italian_savory_v1" %}selected{% endif %}>Italienne salée (italian_savory_v1)</option>
          </select>
        </div>
        <div>
          <label for="servings">Portions cible</label>
          <input type="number" id="servings" name="servings" value="{{ form.servings }}" min="1" max="100" required>
        </div>
        <div>
          <label for="model">Modèle Épicure
            <span class="hint">— cooc | core</span>
          </label>
          <select id="model" name="model">
            <option value="cooc" {% if form.model == "cooc" %}selected{% endif %}>cooc (associations réelles)</option>
            <option value="core" {% if form.model == "core" %}selected{% endif %}>core (créatif)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Contraintes</h2>
      <div class="row">
        <div>
          <label for="diet">Régime
            <span class="hint">— séparé par des virgules (ex. « végétarien »).</span>
          </label>
          <input type="text" id="diet" name="diet" value="{{ form.diet }}" placeholder="végétarien">
        </div>
        <div>
          <label for="no_cookware">Sans matériel
            <span class="hint">— ex. « pas_de_four », séparé par des virgules.</span>
          </label>
          <input type="text" id="no_cookware" name="no_cookware" value="{{ form.no_cookware }}" placeholder="pas_de_four">
        </div>
        <div>
          <label for="highlight">Mettre en avant
            <span class="hint">— ingrédient à valoriser (optionnel).</span>
          </label>
          <input type="text" id="highlight" name="highlight" value="{{ form.highlight }}" placeholder="tomate">
        </div>
      </div>
    </div>

    <button type="submit">Générer la recette</button>
  </form>
{% endblock %}
